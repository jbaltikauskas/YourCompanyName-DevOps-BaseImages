name: Docker-Alpine

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  REGISTRY: ghcr.io

  IMAGE_NAME: alpine-net-10

  DOCKERFILE: ./dockerfiles/alpine/10/dockerfile

  DOCKER_BUILD_CONTEXT: ./dockerfiles/alpine/10

  DOTNET_VERSION: "10.0"
  INSTALL_DIAGNOSTIC_TOOLS: "true"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image datetime tag
        id: image-datetime
        run: echo "tag=$(date -u +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Image name for GHCR (lowercase)
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.image-datetime.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=YourCompanyName .NET 10 base image (Alpine)
          annotations: |
            org.opencontainers.image.description=YourCompanyName .NET 10 base image (Alpine)

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: ${{ env.INSTALL_DIAGNOSTIC_TOOLS == 'true' && 'final-diagnostics' || 'final' }}
          build-args: |
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}
            INSTALL_DIAGNOSTIC_TOOLS=${{ env.INSTALL_DIAGNOSTIC_TOOLS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.image-datetime.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          labels: |
            ${{ steps.meta.outputs.labels }}
          annotations: |
            ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          printf '%s\n' \
            "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.image-datetime.outputs.tag }}" \
            "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest" \
            | xargs -I {} cosign sign --yes {}@"${DIGEST}"
